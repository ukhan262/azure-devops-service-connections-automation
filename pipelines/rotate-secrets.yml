# Scheduled: checks every managed subscription's client secret weekly and
# rotates anything within 30 days of expiry. This is what keeps
# secret-based auth from turning back into a manual-renewal problem.

trigger: none
pr: none

schedules:
  - cron: '0 6 * * 1'   # every Monday 06:00 UTC
    displayName: 'Weekly client secret rotation check'
    branches:
      include:
        - main
    always: true

parameters:
  - name: azureCloud
    displayName: 'Azure cloud'
    type: string
    default: AzureCloud
    values:
      - AzureUSGovernment   # Azure Government
      - AzureCloud          # commercial / public Azure
  - name: poolType
    displayName: 'Agent pool type'
    type: string
    default: selfHosted
    values:
      - selfHosted        # your own agents (required on Azure DevOps Server)
      - microsoftHosted   # Azure Pipelines hosted agents (Azure DevOps Services only)
  - name: selfHostedPoolName
    displayName: 'Self-hosted pool name'
    type: string
    default: 'OnPremAgents'
  - name: vmImage
    displayName: 'Microsoft-hosted image'
    type: string
    default: 'ubuntu-latest'

variables:
  # Each cloud has its own tenant, bootstrap identity and Key Vault, so
  # each gets its own variable group with the same variable names.
  - ${{ if eq(parameters.azureCloud, 'AzureUSGovernment') }}:
    - group: azure-service-connections-secrets
  - ${{ if eq(parameters.azureCloud, 'AzureCloud') }}:
    - group: azure-service-connections-secrets-commercial

jobs:
  - job: RotateSecrets
    displayName: 'Rotate client secrets'
    # Conditionals aren't allowed inside a pipeline-level pool:, so the
    # whole pool key is inserted conditionally at the job level instead.
    ${{ if eq(parameters.poolType, 'selfHosted') }}:
      pool:
        name: ${{ parameters.selfHostedPoolName }}
    ${{ if eq(parameters.poolType, 'microsoftHosted') }}:
      pool:
        vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self

      - template: templates/install-modules.yml
        parameters:
          poolType: ${{ parameters.poolType }}

      - task: PowerShell@2
        displayName: 'Connect and rotate client secrets nearing expiry'
        inputs:
          targetType: inline
          pwsh: true
          script: |
            # Connect in the same step as the work: Connect-MgGraph only lasts for
            # this pwsh process, and each PowerShell@2 task starts a new one.
            Import-Module "$(Build.SourcesDirectory)/scripts/common/Common.psm1" -Force
            $bootstrapSecret = ConvertTo-SecureString "$(BootstrapClientSecret)" -AsPlainText -Force
            Connect-AutomationContext `
              -TenantId "$(TenantId)" `
              -ApplicationId "$(BootstrapAppId)" `
              -ClientSecret $bootstrapSecret `
              -AzureCloud "${{ parameters.azureCloud }}"

            & "$(Build.SourcesDirectory)/scripts/Invoke-SecretRotation.ps1" `
              -ConfigFolder "$(Build.SourcesDirectory)/config" `
              -KeyVaultName "$(KeyVaultName)" `
              -CollectionUrl "$(CollectionUrl)" `
              -ProjectName "$(ProjectName)" `
              -PersonalAccessToken "$(PersonalAccessToken)" `
              -TenantId "$(TenantId)" `
              -AzureCloud "${{ parameters.azureCloud }}"
